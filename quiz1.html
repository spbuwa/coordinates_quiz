<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coordinates Quiz: Continent &amp; Hemisphere</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#5d6678;--line:#d9dde5;--accent:#2563eb;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--text:#e8ebf2;--muted:#9aa3b5;--line:#2e364a;--accent:#6ea0ff;--ok:#6ee7a0;--okbg:#12361f;--bad:#fca5a5;--badbg:#3b1717}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--text:#e8ebf2;--muted:#9aa3b5;--line:#2e364a;--accent:#6ea0ff;--ok:#6ee7a0;--okbg:#12361f;--bad:#fca5a5;--badbg:#3b1717}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.meta{color:var(--muted);font-size:.85rem;margin-bottom:6px}
.q{font-size:1.25rem;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.note{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:.94rem}
.score{font-size:2.6rem;font-weight:700;margin:6px 0}
.tip{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <p style="margin:0 0 8px"><a class="back" href="index.html">← All quizzes</a></p>
<h1>🌍 Coordinates Quiz</h1>
<p class="sub">Name the continent and the hemispheres for each location.</p>
<div class="bar"><i id="bar"></i></div>
<div class="card" id="card"></div>
<p class="tip" style="margin-top:14px">Tip: N/S comes from latitude, E/W from longitude (relative to the Prime Meridian).</p>
</main>
<script>
var Q=[
["19.08° N, 72.88° E",["Asia; Northern and Eastern","Africa; Northern and Eastern","Asia; Southern and Eastern","Asia; Northern and Western"],0,"A large coastal city on India’s west coast.","Positive latitude (N) and positive longitude (E). This is near Mumbai, India, in Asia."],
["33.87° S, 151.21° E",["Australia/Oceania; Northern and Eastern","Australia/Oceania; Southern and Eastern","Asia; Southern and Eastern","Australia/Oceania; Southern and Western"],1,"This city has a famous opera house.","South latitude is the Southern Hemisphere; east longitude is the Eastern Hemisphere. This is Sydney, Australia."],
["40.71° N, 74.01° W",["Europe; Northern and Western","North America; Southern and Western","North America; Northern and Western","North America; Northern and Eastern"],2,"The Statue of Liberty is nearby.","North latitude is Northern; west longitude is Western. This is New York City, USA."],
["33.92° S, 18.42° E",["South America; Southern and Eastern","Africa; Northern and Eastern","Africa; Southern and Western","Africa; Southern and Eastern"],3,"Table Mountain overlooks this city.","South latitude and east longitude give Southern and Eastern. This is Cape Town, South Africa."],
["23.55° S, 46.63° W",["South America; Southern and Western","South America; Northern and Western","Africa; Southern and Western","North America; Southern and Western"],0,"The largest city in Brazil.","South latitude is Southern; west longitude is Western. This is São Paulo, Brazil."],
["51.51° N, 0.13° W",["Europe; Northern and Eastern","Europe; Northern and Western","Europe; Southern and Western","North America; Northern and Western"],1,"The Prime Meridian passes right through this country’s capital.","North latitude is Northern; 0.13° W is just west of the Prime Meridian, so Western. This is London, UK."],
["35.68° N, 139.69° E",["Asia; Northern and Western","Asia; Southern and Eastern","Asia; Northern and Eastern","Australia/Oceania; Northern and Eastern"],2,"Capital of an island nation in East Asia.","North latitude and east longitude give Northern and Eastern. This is Tokyo, Japan."],
["1.29° S, 36.82° E",["Africa; Southern and Eastern","Africa; Northern and Eastern","Asia; Southern and Eastern","Africa; Southern and Western"],0,"Just below the Equator in East Africa.","1.29° S is just south of the Equator, so Southern; 36.82° E is Eastern. This is Nairobi, Kenya."],
["90° S, 0°",["Australia/Oceania","South America","Africa","Antarctica"],3,"The southernmost point on Earth.","90° S is the South Pole, in Antarctica. At the poles, longitude has no meaning, so east/west doesn’t apply."],
["19.43° N, 99.13° W",["South America; Northern and Western","North America; Northern and Western","North America; Northern and Eastern","North America; Southern and Western"],1,"Capital of a country south of the USA.","North latitude is Northern; west longitude is Western. This is Mexico City, Mexico."]
];
var i=0,score=0,done=false,card=document.getElementById("card"),bar=document.getElementById("bar");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function show(){
  done=false;var q=Q[i];
  bar.style.width=(i/Q.length*100)+"%";
  var h='<div class="meta">Question '+(i+1)+' of '+Q.length+'</div><p class="q">'+esc(q[0])+'</p>';
  q[1].forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'});
  h+='<div class="row"><button class="link" id="hint">Show hint</button></div><div id="fb"></div>';
  card.innerHTML=h;
  card.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.k)}});
  document.getElementById("hint").onclick=function(){
    var n=document.createElement("div");n.className="note";n.textContent="Hint: "+q[3];
    this.replaceWith(n)};
}
function pick(k){
  if(done)return;done=true;var q=Q[i],right=k===q[2];
  if(right)score++;
  card.querySelectorAll(".opt").forEach(function(b,n){
    b.disabled=true;
    if(n===q[2])b.classList.add("ok");
    else if(n===k)b.classList.add("bad");
  });
  var last=i===Q.length-1;
  document.getElementById("fb").innerHTML='<div class="note"><strong>'+(right?"Correct!":"Not quite.")+'</strong> '+esc(q[4])+'</div><div class="row"><button class="btn" id="next">'+(last?"See results":"Next question")+'</button></div>';
  document.getElementById("next").onclick=function(){last?finish():(i++,show())};
}
function finish(){
  bar.style.width="100%";
  var m=score>=9?"Outstanding map skills!":score>=7?"Great work!":score>=5?"Good effort. Review the N/S and E/W rules and try again.":"Keep practicing. Latitude gives N/S, longitude gives E/W.";
  card.innerHTML='<div class="meta">Your result</div><div class="score">'+score+' / '+Q.length+'</div><p>'+m+'</p><div class="row"><button class="btn" id="again">Try again</button><a class="btn" href="with_map.html">Next: Quiz 2 →</a><a class="back" href="index.html">Back to all quizzes</a></div></div>';
  document.getElementById("again").onclick=function(){i=0;score=0;show()};
}
show();
</script>
</body>
</html>
